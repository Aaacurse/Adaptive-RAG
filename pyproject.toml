[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  
    "W",  
    "F",   
    "I",   
    "UP",  
]
ignore = [
    "E501",  
]
exclude = ["env/", "tests/"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["env/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "env/*"]

[tool.coverage.report]
fail_under = 70       
show_missing = true